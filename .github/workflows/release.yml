# name: Build docker image, upload to GHCR and let the self runner know about the new version
name: New version update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: "./backend"
    
    env: 
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: kalaka_testing
      DB_USER: test_user
      DB_PASSWORD: test_password
    
    services:
      postgres:
        image: postgres:18.6
        env: 
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kalaka_testing
          DB_USER: test_user
          DB_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        
    steps:
      # Get the latest version
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Set up Node.js v24.21.0"
        uses: actions/setup-node@v7
        with:
          node-version-file: "./backend/package.json"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: "Install dependencies"
        run: npm ci

      # Node v24 doesn't validate types in execution, we validate them here.
      - name: "Validate types"
        run: npx tsc --noEmit

      - name: "Run test suites"
        run: npm run pretest

      - name: "Run test suites"
        run: npm test



  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Get the latest version
      - name: "Checkout repository"
        uses: actions/checkout@v7

      # Authenticate into GHCR
      - name: "Login to GHRC"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract the docker metadata
      - name: "Extract Docker metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Build the image and push to GHCR
      - name: "Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
