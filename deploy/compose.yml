services: 

  db:
    image: postgres:18.6
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    env_file: ".env.database"

  migrate: 
    image: ghcr.io/izeta8/kalaka:0.0.4
    command: [ "node", "./src/scripts/migrate.js" ]
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file: 
      - ".env.database"
      - ".env.backend"
    
  backend:
    build: ../backend
    image: ghcr.io/izeta8/kalaka:0.0.4
    restart: always
    ports:
      - ${BACKEND_EXPOSED_PORT}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: 
      - ".env.database"
      - ".env.backend"
      
  worker: 
    image: ghcr.io/izeta8/kalaka_worker:0.0.2
    build: ../ai
    restart: always
    env_file:
      - ".env.database"
      - ".env.worker"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data: